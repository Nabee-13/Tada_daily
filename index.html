<body>
<main>
 <header class="full">
  <div class="tabs"><div class="logo">🗓️<small>쨔뿌러지는<br>일과</small><small id="syncst"></small></div><button id="vd">일간</button><button id="vw">주간</button><button id="vm">월간</button><button id="vy">가계부</button><button id="vs" class="vs">⚙ 설정</button></div>
  <div class="nav"><button id="prev">◀</button><h1 id="title"></h1><button id="next">▶</button><button id="today">오늘</button></div>
  <div class="tagbar" id="tagbar"></div>
 </header>
 <div class="full blkbar" id="blkbar" hidden></div>
 <div class="zone" id="zT"></div><div class="zone" id="zL"></div><div class="zone" id="zR"></div>

 <section class="card" id="dayL">
  <button class="addbtn" id="addTask">+ 할 일 추가</button>
  <div class="row" style="margin-top:14px"><span class="sub" style="flex:1">⠿ 끌어서 순서 변경 · 다른 분류 위로 놓으면 분류 이동</span><button class="sm" id="moveD">날짜 옮기기·복사</button><button class="sm" id="sortT">시간순 정렬</button></div>
  <div id="list"></div>
 </section>
 <section class="card" id="dayG">
  <div class="grid" id="grid"></div>
  <p class="sub" style="margin:10px 0 0">시간을 지정한 할 일은 완료 체크하면 칠해지고, "체크 안 해도 칠하기"를 켠 일정은 항상 칠해져요. 시간표를 끌어서(또는 시작 칸·끝 칸을 차례로 눌러) 시간을 고르면 그 시간으로 할 일을 추가할 수 있어요. 하루 시작 시각은 ⚙ 설정에서 바꿀 수 있어요(기본 7시). 굵은 시간은 다음 날 새벽이고, 끝 시간이 시작보다 빠른 일정은 다음 날 시간표까지 이어서 칠해져요.</p>
  
 </section>
 <section class="card" id="setP" hidden></section>
 <section class="card" id="wkP"></section>
 <section class="card" id="wkL"><div id="wkCL"></div></section>
 <section class="card" id="wkG"><div class="wk" id="wk"></div></section>
 <section class="card" id="wkS"><b>주간 시간 배분</b><div class="stats" id="stW"></div></section>
 <section class="card" id="moP"></section>
 <section class="card" id="moL"><div id="moCL"></div></section>
 <section class="card" id="moG"><div class="mo" id="mo"></div></section>
 <section class="card" id="moS"><b>월간 시간 배분</b><div class="stats" id="stM"></div></section>
<section class="card" id="dayS"><b>시간 배분</b><div class="stats" id="stD"></div></section>
 <section class="card" id="memo1" hidden></section>
<section class="card" id="memo2" hidden></section>

 <section class="card" id="dayM" hidden></section>
 
 <div id="moneyS" style="display:none"></div>
 <section class="card" id="mnS"></section>
 <section class="card" id="mnB"></section>
 <section class="card" id="mnF"></section>
 <section class="card" id="mnC"></section>
 <section class="card" id="mnD"></section>
 <section class="card" id="mnL"></section>
 <section class="card" id="mnR"></section>
<section class="card" id="dayB"></section>
 <section class="card" id="dayC"></section>
</main>
